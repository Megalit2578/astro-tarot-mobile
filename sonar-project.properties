# Cấu hình quét SonarQube cho app Flutter.
#
# SonarQube Community không có sẵn Dart; cần plugin cộng đồng sonar-flutter
# (insideapp-oss/sonar-flutter, đã chạy thử bản 0.5.2 trên SonarQube 26.9).
# Cách chạy xem README, mục "SonarQube".
sonar.projectKey=astrotarot-mobile
sonar.projectName=AstroTarot Mobile
sonar.sourceEncoding=UTF-8

sonar.sources=lib
sonar.tests=test
sonar.exclusions=**/*.g.dart

# Plugin 0.5.2 đổ lỗi NoClassDefFoundError (DefaultIssueLocation) khi tự ghi
# lỗi phân tích trên SonarQube 10+. Nên tắt phần đó (MANUAL + báo cáo rỗng)
# và nạp kết quả `flutter analyze` qua định dạng issue chung của Sonar —
# tool/sonar.sh sinh ra tệp build/sonar/analyzer-issues.json.
sonar.dart.analyzer.mode=MANUAL
sonar.dart.analyzer.report.path=build/sonar/analyzer-empty.txt
sonar.dart.analyzer.options.override=false
sonar.externalIssuesReportPaths=build/sonar/analyzer-issues.json
sonar.flutter.coverage.reportPath=coverage/lcov.info
sonar.flutter.tests.reportPath=build/sonar/tests.output

# test/coverage_helper_test.dart là tệp sinh ra (nằm trong .gitignore), nhưng
# báo cáo test vẫn nhắc tới nó; không tắt loại trừ theo SCM thì Sonar báo
# "Unable to find test file".
sonar.scm.exclusions.disabled=true
