# Kiểm tra mỗi lần đẩy code: phân tích sạch, test xanh, và APK dựng được.
#
# Giữ cùng quy ước với hai repo web (astro-tarot-web-be và -fe): tên job tiếng
# Việt, chạy trên push và pull request vào main.
name: CI

on:
  push:
    branches: [main, develop, "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Phân tích, test và dựng APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ghim ĐÚNG bản Flutter đang dùng ở máy dev (3.47.2). Để "stable" trôi
      # thì một hôm nào đó Flutter ra bản mới và CI đỏ vì lý do chẳng liên
      # quan gì tới thay đổi vừa đẩy — mất thời gian nhất là kiểu đó.
      - name: Cài Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # Java 17: Gradle của Android cần JDK, và runner mặc định chưa chắc có
      # bản phù hợp.
      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tải phụ thuộc
        run: flutter pub get

      # --fatal-infos: gợi ý cũng làm đỏ CI. Để chúng tích lại thì đến lúc
      # muốn dọn sẽ có hàng trăm cái và không ai dọn nữa.
      - name: Phân tích
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Dựng APK thật chứ không chỉ biên dịch Dart. Các plugin native
      # (flutter_webrtc, image_picker, flutter_secure_storage) chỉ lộ lỗi cấu
      # hình Android ở bước này.
      #
      # LƯU Ý về compileSdk: permission_handler_android ghim cứng 37, nên
      # android/app/build.gradle.kts cũng ghim 37. Trên máy dev còn phải tạo
      # junction platforms/android-37 vì SDK Manager cài vào thư mục tên
      # android-37.0 — xem README. Runner của GitHub tải SDK sạch nên không
      # dính bẫy đó.
      - name: Dựng APK (debug)
        run: flutter build apk --debug
